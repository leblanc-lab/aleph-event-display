#ctl label{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer}
.sw{width:22px;height:4px;border-radius:2px;display:inline-block}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
button{background:#1A1E2B;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}

#hint{bottom:14px;right:14px;color:var(--muted);font-size:12px}
#tip{position:fixed;pointer-events:none;display:none;font-size:13px;line-height:1.5;padding:8px 11px;min-width:190px}
#tip b{color:var(--fg)}#tip .k{color:var(--muted)}

// detector wireframe (geometry from the ALEPH detector paper, NIM A294 (1990) 121)
const G=D.geom;
function ring(r,z,n,rot,col,op){const pts=[];const N=n||128;for(let k=0;k<=N;k++){const a=(rot||0)+(n?Math.PI/n:0)+2*Math.PI*k/N;const rr=n?r/Math.cos(Math.PI/n):r;pts.push(V(rr*Math.cos(a),rr*Math.sin(a),z));}
 return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op}));}
function staves(r,z0,z1,n,rot,col,op){const g=new THREE.Group();const rr=r/Math.cos(Math.PI/n);for(let k=0;k<n;k++){const a=(rot||0)+Math.PI/n+2*Math.PI*k/n;
 g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(rr*Math.cos(a),rr*Math.sin(a),z0),V(rr*Math.cos(a),rr*Math.sin(a),z1)]),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op})));}return g;}
function shell(r0,r1,z0,z1,n,rot,col,op){const g=new THREE.Group();for(const z of [z0,z1]){g.add(ring(r0,z,n,rot,col,op));g.add(ring(r1,z,n,rot,col,op));}g.add(staves(r1,z0,z1,n||24,rot,col,op*.6));return g;}
const er=G.ecalrot*Math.PI/180;

groups.det.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0,0,-600),V(0,0,600)]),new THREE.LineBasicMaterial({color:C.det,transparent:true,opacity:.8})));
// tracks: tubes for selected and V⁰ daughters, thin lines for the others; each carries its record for the tooltip
const pickable=[];
for(const t of arr(D.tracks)){const pts=t.p.map(q=>V(q[0],q[1],q[2]));if(pts.length<2)continue;
 const col=t.c==='v0'?C.v0:t.c==='oth'?C.other:C.track;
 const curve=new THREE.CatmullRomCurve3(pts);
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(8,pts.length*2),t.c==='oth'?.5:.9,6,false),new THREE.MeshBasicMaterial({color:col}));
 mesh.userData={kind:t.c==='v0'?'V⁰ daughter track':t.c==='oth'?'track (not selected)':'selected track',info:t.i,color:col};
 groups[t.c].add(mesh);pickable.push(mesh);

// With the crossings shown, the fitted tracks fade behind them (as DALI drew coordinates over the fit).
function fadeTracks(on){for(const k of ['sel','v0','oth'])groups[k].traverse(o=>{if(o.isMesh){o.material.transparent=true;o.material.opacity=on?.35:1;}});}

 mesh.position.copy(a).addScaledVector(d,.5);mesh.quaternion.setFromUnitVectors(up,d.clone().normalize());
 if(b.u){mesh.material.color.set(C.other);mesh.material.opacity=.7;}
 groups[b.u?'oth':b.k].add(mesh);
 mesh.userData={kind:b.u?'ECAL cluster (neutral object failing the selection)':b.k==='em'?'ECAL cluster':'HCAL cluster',energy:b.e,color:b.u?C.other:(b.k==='em'?C.em:C.hc)};pickable.push(mesh);}
for(const v of arr(D.v0)){const m=new THREE.Mesh(new THREE.OctahedronGeometry(3),new THREE.MeshBasicMaterial({color:C.v0}));m.position.copy(V(...v));groups.v0.add(m);}
{const a=D.axis;const pts=[V(-560*a[0],-560*a[1],-560*a[2]),V(560*a[0],560*a[1],560*a[2])];

// Fit the whole detector to the window: the camera distance that makes a box of the given
// half-width (horizontal) and half-height (vertical) just fit, for the current aspect ratio.
const FIT={end:[560,560],side:[600,560],'3d':[720,600]};
let current='3d';
function fitDistance(hw,hh){const v=cam.fov*Math.PI/360;const hfov=Math.atan(Math.tan(v)*cam.aspect);return 1.08*Math.max(hh/Math.tan(v),hw/Math.tan(hfov));}
function view(kind){current=kind;for(const b of ['v3d','vend','vside'])document.getElementById(b).classList.toggle('on',b==='v'+kind);
 const [hw,hh]=FIT[kind];const dist=fitDistance(hw,hh);
 const dir=kind==='end'?new THREE.Vector3(1,0,0):kind==='side'?new THREE.Vector3(0,0,1):new THREE.Vector3(-.62,.36,.70).normalize();
 ctl.target.set(0,0,0);cam.up.set(0,1,0);cam.position.copy(dir.multiplyScalar(dist));cam.lookAt(0,0,0);ctl.update();}

// hover details
const tip=document.getElementById('tip'),ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let hovered=null;
const f=(x,u='')=>x===null||x===undefined?'–':x+u;
function describe(u){if(u.energy!==undefined)return `<b>${u.kind}</b><br><span class="k">energy</span> ${u.energy.toFixed(2)} GeV`;
 const i=u.info;return `<b>${u.kind}</b><br><span class="k">p</span> ${f(i.p,' GeV')} &nbsp; <span class="k">pₜ</span> ${f(i.pt,' GeV')} &nbsp; <span class="k">q</span> ${i.q>0?'+':i.q<0?'−':'0'}<br>`+
  `<span class="k">cos θ</span> ${f(i.cth)}<br><span class="k">hits VDET / ITC / TPC</span> ${i.hits.join(' / ')}<br>`+
  `<span class="k">d₀, z₀</span> ${f(i.d0,' cm')}, ${f(i.z0,' cm')}<br><span class="k">χ² / ndf</span> ${f(i.chi2)} / ${i.ndf}<br>`+
  `<span class="k">dE/dx (pads)</span> ${f(i.dedx)}${i.dedxerr!==null?' ± '+i.dedxerr:''}<br><span class="k">dE/dx (wires)</span> ${f(i.dedxw)}`;}
canvas.addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-e.clientY/innerHeight*2+1;ray.setFromCamera(mouse,cam);

 if(hovered&&(!hit||hit.object!==hovered)){hovered.material.color.set(hovered.userData.color||hovered.material.color);hovered=null;}
 if(hit){const o=hit.object;if(o!==hovered&&o.userData.color){o.material.color.set(0xFFFFFF);hovered=o;}

 else tip.style.display='none';});
